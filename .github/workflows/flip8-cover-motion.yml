name: Build Galaxy Z Flip Cover Motion APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/flip8-cover-motion.yml"

permissions:
  contents: read

jobs:
  build-flip8-cover:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Flip8 main and FlexWindow motion patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          files = {
              'app/src/main/java/com/example/duofoldwallpaper/DeviceConfig.kt': '',
              'app/src/main/java/com/example/duofoldwallpaper/ShaderCode.kt': '',
              'app/src/main/java/com/example/duofoldwallpaper/DuoWallpaperService.kt': '',
              'app/src/main/java/com/example/duofoldwallpaper/MainActivity.kt': '',
              'app/build.gradle.kts': '',
              'app/src/main/AndroidManifest.xml': '',
              'app/src/main/res/values/strings.xml': '',
          }
          for rel, data in files.items():
              p = pathlib.Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))
              print('patched', rel)
          PY

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duo-fold-wallpaper-flip8-cover-motion
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
